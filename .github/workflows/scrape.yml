name: Scrape Job Postings

on:
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run the full scrape (all sources). Leave unchecked for a small validation run first."
        type: boolean
        default: false
      run_kariyer:
        description: "Run kariyer.net scraper"
        type: boolean
        default: true
      run_secretcv:
        description: "Run secretcv.com scraper"
        type: boolean
        default: true
      run_yenibiris:
        description: "Run yenibiris.com scraper (currently 403s from GitHub Actions' IP)"
        type: boolean
        default: false
      run_linkedin:
        description: "Run LinkedIn scraper (anonymous mode)"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The scrapers alone take two hours and change: kariyer runs 36-39 minutes
    # and LinkedIn 96-110, and link checking needs another 45 after them. At 180
    # the run that succeeded on 24 Aug finished with twenty seconds to spare, so
    # the 25th, when LinkedIn was 13 minutes slower, was cancelled mid-check and
    # the upload never happened -- three of five nights died that way, and a
    # cancelled job silently leaves the site on stale data.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend/scraper
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine schedule flags
        id: sched
        run: echo "is_scrape_day=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        if: github.event_name != 'schedule' || steps.sched.outputs.is_scrape_day == 'true'
        run: pip install playwright beautifulsoup4 boto3 requests linkedin-jobs-scraper==5.0.2 jsonlines pydantic pytest

      - name: Install Playwright browsers
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_kariyer == true
        run: playwright install --with-deps chromium

      - name: Install Xvfb
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_kariyer == true
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run kariyer.net scraper
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_kariyer == true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full_run }}" = "true" ]; then
            xvfb-run -a python kariyer_scraper.py
          else
            xvfb-run -a python -c "import kariyer_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      - name: Run secretcv.com scraper
        if: inputs.run_secretcv == true
        run: |
          if [ "${{ inputs.full_run }}" = "true" ]; then
            python secretcv_scraper.py
          else
            python -c "import secretcv_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      - name: Run yenibiris.com scraper
        if: github.event_name == 'workflow_dispatch' && inputs.run_yenibiris == true
        run: |
          if [ "${{ inputs.full_run }}" = "true" ]; then
            python yenibiris_scraper.py
          else
            python -c "import yenibiris_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      # ⚠ anonymous (no-login) mode — the library itself warns it "is no
      # longer maintained and it won't probably work". Confirmed working (as
      # of writing) from both a residential IP and GitHub Actions' IP, but
      # there's no guarantee it keeps working if LinkedIn changes its site.
      - name: Install Google Chrome (for LinkedIn scraper)
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_linkedin == true
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run LinkedIn scraper
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_linkedin == true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full_run }}" = "true" ]; then
            python linkedin_scraper.py
          else
            python -c "import linkedin_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_RESULTS_PER_SOURCE = 5; s.main()"
          fi
      - name: Archive dated snapshot
        if: (github.event_name == 'workflow_dispatch' || steps.sched.outputs.is_scrape_day == 'true') && !cancelled()
        run: |
          aws s3 cp \
            s3://calibrate-teamthrow/scraper-data/postings.jsonl \
            s3://calibrate-teamthrow/scraper-data/snapshots/postings_$(date -u +%F).jsonl
      - name: Generate trend and demand data
        id: generate
        if: (github.event_name == 'workflow_dispatch' || steps.sched.outputs.is_scrape_day == 'true') && !cancelled()
        run: |
          aws s3 cp s3://calibrate-teamthrow/scraper-data/postings.jsonl scraper/postings.jsonl
          python pipeline/build_trends.py
          python pipeline/build_demand_profile.py
        working-directory: backend
        env:
          PYTHONPATH: app:.
      # Boards rate limit hard, so this is paced at one request per host every
      # 2s and works through a slice of the backlog each night rather than the
      # whole corpus at once. Postings it has not reached yet stay off the page.
      - name: Verify posting links and build the job board
        id: postings
        if: steps.generate.outcome == 'success' && !cancelled()
        run: |
          aws s3 cp s3://calibrate-teamthrow/pipeline-data/link_status.json app/link_status.json || true
          python pipeline/check_links.py
          python pipeline/build_postings.py
        working-directory: backend
        env:
          PYTHONPATH: app:.
      - name: Test
        id: test
        if: steps.postings.outcome == 'success' && !cancelled()
        run: |
          pytest
        working-directory: backend
      - name: Upload trend and demand data to S3.
        id: upload
        if: steps.test.outcome == 'success' && !cancelled()
        run: |
          aws s3 cp app/trends.json s3://calibrate-teamthrow/pipeline-data/trends.json
          aws s3 cp app/demand_profile.json s3://calibrate-teamthrow/pipeline-data/demand_profile.json
          aws s3 cp app/active_postings.json s3://calibrate-teamthrow/pipeline-data/active_postings.json
          aws s3 cp app/link_status.json s3://calibrate-teamthrow/pipeline-data/link_status.json
        working-directory: backend
      - name: Test the live api
        if: steps.upload.outcome == 'success' && !cancelled()
        run: |
          curl -f https://2rhhcqbv25oz3p7lgb7rzpkova0fnsdk.lambda-url.eu-central-1.on.aws/

