name: Scrape Job Postings

on:
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run the full scrape (all sources). Leave unchecked for a small validation run first."
        type: boolean
        default: false
      run_kariyer:
        description: "Run kariyer.net scraper"
        type: boolean
        default: true
      run_secretcv:
        description: "Run secretcv.com scraper"
        type: boolean
        default: true
      run_yenibiris:
        description: "Run yenibiris.com scraper (currently 403s from GitHub Actions' IP)"
        type: boolean
        default: false
      run_linkedin:
        description: "Run LinkedIn scraper (anonymous mode)"
        type: boolean
        default: true
      test_yenibiris_playwright:
        description: "One-off: test whether Playwright gets past yenibiris.com's block on GitHub Actions' IP (see yenibiris_playwright_test.py)"
        type: boolean
        default: false
  schedule:
    # Fires daily; the "Determine schedule flags" step below decides whether
    # today is actually a scrape day. cron's own day-of-month step syntax
    # (e.g. "1-31/3") resets at every month boundary — days 31→1 are only 1
    # day apart, not 3 — so a true "1 day scrape, 2 days off" rolling cadence
    # is computed in shell instead, from a day count that never resets.
    # secretcv and yenibiris are NOT on the schedule at all — manual
    # (workflow_dispatch) only. yenibiris.com blocks GitHub Actions' IP with
    # a 403.
    - cron: "0 3 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend/scraper
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The cron fires every day — figure out here whether today is actually
      # one of the "1 scrape day, 2 days off" days, using a day count from a
      # fixed epoch (never resets, unlike cron's own day-of-month step).
      # Every other step below is gated on this for schedule runs, so a
      # non-scrape day costs only this one cheap step.
      - name: Determine schedule flags
        id: sched
        run: |
          days=$(( $(date -u +%s) / 86400 ))
          if [ $((days % 3)) -eq 0 ]; then
            echo "is_scrape_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_scrape_day=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        if: github.event_name != 'schedule' || steps.sched.outputs.is_scrape_day == 'true'
        run: pip install playwright beautifulsoup4 boto3 requests linkedin-jobs-scraper

      - name: Install Playwright browsers
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_kariyer == true || inputs.test_yenibiris_playwright == true
        run: playwright install --with-deps chromium

      - name: Install Xvfb
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_kariyer == true
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run kariyer.net scraper
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_kariyer == true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full_run }}" = "true" ]; then
            xvfb-run -a python kariyer_scraper.py
          else
            xvfb-run -a python -c "import kariyer_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      # NOT on the schedule at all anymore — manual (workflow_dispatch) only.
      - name: Run secretcv.com scraper
        if: inputs.run_secretcv == true
        run: |
          if [ "${{ inputs.full_run }}" = "true" ]; then
            python secretcv_scraper.py
          else
            python -c "import secretcv_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      # NOT included on the `schedule` trigger — yenibiris.com 403s GitHub
      # Actions' IP, so the automatic weekly run skips it until that's
      # resolved. Still runnable manually (e.g. from a different runner/IP).
      - name: Run yenibiris.com scraper
        if: github.event_name == 'workflow_dispatch' && inputs.run_yenibiris == true
        run: |
          if [ "${{ inputs.full_run }}" = "true" ]; then
            python yenibiris_scraper.py
          else
            python -c "import yenibiris_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      # One-off diagnostic: is yenibiris.com's 403 an IP/ASN-level block
      # (this would still fail, same as requests) or a bot-fingerprint check
      # a real browser engine can pass (this would succeed) even from the
      # same GitHub Actions IP? Delete this step (and the test script) once
      # we have an answer either way.
      - name: Test yenibiris.com with Playwright
        if: inputs.test_yenibiris_playwright == true
        run: python yenibiris_playwright_test.py

      # ⚠ anonymous (no-login) mode — the library itself warns it "is no
      # longer maintained and it won't probably work". Confirmed working (as
      # of writing) from both a residential IP and GitHub Actions' IP, but
      # there's no guarantee it keeps working if LinkedIn changes its site.
      - name: Install Google Chrome (for LinkedIn scraper)
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_linkedin == true
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run LinkedIn scraper
        if: (github.event_name == 'schedule' && steps.sched.outputs.is_scrape_day == 'true') || inputs.run_linkedin == true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full_run }}" = "true" ]; then
            python linkedin_scraper.py
          else
            python -c "import linkedin_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_RESULTS_PER_SOURCE = 5; s.main()"
          fi

      # Dated, immutable copy of the corpus as it stood after this run — the
      # live postings.jsonl gets overwritten every run, so without this we
      # have no trend history at all. Server-side S3 copy, runs once after
      # every scraper above has finished (not inside sync_to_s3(), which
      # runs once per scraper and would produce four partial snapshots).
      # Skipped on non-scrape schedule days — nothing changed in S3, so a
      # snapshot would just be a redundant copy of the previous one.
      - name: Archive dated snapshot
        if: github.event_name == 'workflow_dispatch' || steps.sched.outputs.is_scrape_day == 'true'
        run: |
          aws s3 cp \
            s3://calibrate-teamthrow/scraper-data/postings.jsonl \
            s3://calibrate-teamthrow/scraper-data/snapshots/postings_$(date -u +%F).jsonl
