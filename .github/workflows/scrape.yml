name: Scrape Job Postings

on:
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run the full scrape (all sources). Leave unchecked for a small validation run first."
        type: boolean
        default: false
      run_kariyer:
        description: "Run kariyer.net scraper"
        type: boolean
        default: true
      run_secretcv:
        description: "Run secretcv.com scraper"
        type: boolean
        default: true
      run_yenibiris:
        description: "Run yenibiris.com scraper (currently 403s from GitHub Actions' IP — see relevance.py / team notes)"
        type: boolean
        default: true
      run_linkedin_test:
        description: "Exploratory: run linkedin_scraper_test.py (anonymous-mode probe, not a real source yet) — off by default"
        type: boolean
        default: false
  schedule:
    # Every Monday 03:00 UTC, full run — yenibiris is skipped automatically
    # (see the yenibiris step's `if:` below): yenibiris.com blocks GitHub
    # Actions' IP with a 403, so the scheduled run only covers kariyer +
    # secretcv until that's resolved (proxy, or running it elsewhere).
    - cron: "0 3 * * 1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend/scraper
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4 boto3 requests

      - name: Install Playwright browsers
        if: github.event_name == 'schedule' || inputs.run_kariyer == true
        run: playwright install --with-deps chromium

      - name: Install Xvfb
        if: github.event_name == 'schedule' || inputs.run_kariyer == true
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run kariyer.net scraper
        if: github.event_name == 'schedule' || inputs.run_kariyer == true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full_run }}" = "true" ]; then
            xvfb-run -a python kariyer_scraper.py
          else
            xvfb-run -a python -c "import kariyer_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      - name: Run secretcv.com scraper
        if: github.event_name == 'schedule' || inputs.run_secretcv == true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full_run }}" = "true" ]; then
            python secretcv_scraper.py
          else
            python -c "import secretcv_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      # NOT included on the `schedule` trigger — yenibiris.com 403s GitHub
      # Actions' IP, so the automatic weekly run skips it until that's
      # resolved. Still runnable manually (e.g. from a different runner/IP).
      - name: Run yenibiris.com scraper
        if: github.event_name == 'workflow_dispatch' && inputs.run_yenibiris == true
        run: |
          if [ "${{ inputs.full_run }}" = "true" ]; then
            python yenibiris_scraper.py
          else
            python -c "import yenibiris_scraper as s; s.SOURCES = s.SOURCES[:2]; s.MAX_PAGES_PER_SOURCE = 1; s.main()"
          fi

      # Exploratory probe only — checks whether linkedin-jobs-scraper's
      # anonymous (no-login) mode works from GitHub Actions' IP. The library
      # warns it may fail in cloud environments like AWS/Heroku; this is the
      # same class of environment. Never runs on schedule.
      - name: Install Google Chrome (for LinkedIn scraper test)
        if: github.event_name == 'workflow_dispatch' && inputs.run_linkedin_test == true
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run LinkedIn scraper test (anonymous mode)
        if: github.event_name == 'workflow_dispatch' && inputs.run_linkedin_test == true
        run: |
          pip install linkedin-jobs-scraper
          python linkedin_scraper_test.py
