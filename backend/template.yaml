AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  GoogleClientId:
    Type: String
    Description: "OAuth client id from Google Cloud Console"
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: "OAuth client secret from Google Cloud Console"
  ContactEmail:
    Type: String
    Description: "Inbox that messages from the contact page are delivered to"

Globals:
  Function:
    Timeout: 300
    MemorySize: 2048

Resources:
  CalibrateApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: main.handler
      Runtime: python3.13
      Architectures:
        - x86_64
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          USER_TABLE: !Ref UserDataTable
          USER_POOL: !Ref UserPool
          APP_CLIENT: !Ref AppClient
          CONTACT_EMAIL: !Ref ContactEmail
      Policies:
        - S3FullAccessPolicy:
            BucketName: calibrate-teamthrow

        - TextractPolicy: {} 

        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable

        - Statement:
            - Effect: Allow
              Action:
                - "cognito-idp:AdminUpdateUserAttributes"
                - "cognito-idp:AdminDeleteUser"
                # /me calls AdminGetUser to confirm the account behind a still-valid
                # token has not been deleted or disabled since the token was issued.
                - "cognito-idp:AdminGetUser"
              Resource:
                - !GetAtt UserPool.Arn

        - Statement:
            - Effect: Allow
              Action:
                - "ses:SendEmail"
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/usecalibrate.dev"
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*"

        - Statement:
            - Effect: Allow
              Action:
                - "bedrock:InvokeModel"
                - "bedrock:InvokeModelWithResponseStream"
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
                - "arn:aws:bedrock:*::foundation-model/cohere.embed-multilingual-v3"
  UserDataTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: userId
        Type: String
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Spelled out rather than left to the defaults, because PasswordRules.tsx shows
      # this list to the user and the two have to say the same thing.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's built in sender is a shared address on a domain we do not control,
      # it is filtered aggressively, and it is capped at 50 messages a day. Sending
      # through SES from our own verified domain is what lets SPF, DKIM and DMARC
      # line up, which is most of what keeps the message out of a spam folder.
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/usecalibrate.dev"
        From: "Calibrate <verification@usecalibrate.dev>"
        ReplyToEmailAddress: "verification@usecalibrate.dev"
      # Cognito has one code template, not one per flow: the password reset code goes
      # out in this same message. Splitting them apart needs a CustomMessage Lambda
      # trigger, so the wording covers both cases instead.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your Calibrate verification code"
        EmailMessage: |
          <!doctype html>
          <html lang="en">
            <body style="margin:0;padding:0;background:#f4f6f8;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 12px;">
                <tr>
                  <td align="center">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #d3dce3;border-radius:8px;">
                      <tr>
                        <td style="padding:28px 32px 8px 32px;font-family:Helvetica,Arial,sans-serif;">
                          <p style="margin:0;font-size:19px;font-weight:bold;color:#14202b;">Calibrate</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:8px 32px 0 32px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#35434f;">
                          <p style="margin:0 0 18px 0;">Someone asked to confirm this email address for a Calibrate account, or to reset the password on it. Enter the code below to continue.</p>
                        </td>
                      </tr>
                      <tr>
                        <td align="center" style="padding:4px 32px 4px 32px;">
                          <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:bold;letter-spacing:4px;color:#14202b;background:#e9eef2;border-radius:6px;padding:16px 20px;">{####}</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px 0 32px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#35434f;">
                          <p style="margin:0 0 18px 0;">The code is valid for 24 hours. If you did not ask for it, you can ignore this message and nothing will change.</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:8px 32px 28px 32px;border-top:1px solid #d3dce3;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#62717f;">
                          <p style="margin:12px 0 0 0;">Calibrate compares your CV against skills employers are asking for in job postings. Sent from usecalibrate.dev because a code was requested for this address.</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
          </html>
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: calibrate-auth
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        username: sub
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      SupportedIdentityProviders: [COGNITO, Google]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - http://localhost:3000/auth/callback
        - https://main.d1nc4zzbkovnjv.amplifyapp.com/auth/callback
        - https://usecalibrate.dev/auth/callback
        - https://www.usecalibrate.dev/auth/callback
      LogoutURLs:
        - http://localhost:3000/login
        - https://main.d1nc4zzbkovnjv.amplifyapp.com/login
        - https://usecalibrate.dev/login
        - https://www.usecalibrate.dev/login

Outputs:
  FunctionUrl:
    Description: "Lambda Function URL"
    Value: !GetAtt CalibrateApiFunctionUrl.FunctionUrl
  UserPoolId:
    Description: "Cognito user pool id"
    Value: !Ref UserPool
  HostedUiDomain:
    Description: "Cognito hosted UI domain"
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  AppClientId:
    Description: "Cognito app client id"
    Value: !Ref AppClient
