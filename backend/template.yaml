AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  GoogleClientId:
    Type: String
    Description: "OAuth client id from Google Cloud Console"
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: "OAuth client secret from Google Cloud Console"

Globals:
  Function:
    Timeout: 300
    MemorySize: 2048

Resources:
  CalibrateApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: main.handler
      Runtime: python3.13
      Architectures:
        - x86_64
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          USER_TABLE: !Ref UserDataTable
          USER_POOL: !Ref UserPool
          APP_CLIENT: !Ref AppClient
      Policies:
        - S3FullAccessPolicy:
            BucketName: calibrate-teamthrow

        - TextractPolicy: {} 

        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable

        - Statement:
            - Effect: Allow
              Action:
                - "bedrock:InvokeModel"
                - "bedrock:InvokeModelWithResponseStream"
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
                - "arn:aws:bedrock:*::foundation-model/cohere.embed-multilingual-v3"
  UserDataTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: userId
        Type: String
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: calibrate-auth
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        username: sub
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      SupportedIdentityProviders: [COGNITO, Google]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - http://localhost:3000/auth/callback
        - https://main.d1nc4zzbkovnjv.amplifyapp.com/auth/callback
      LogoutURLs:
        - http://localhost:3000/login
        - https://main.d1nc4zzbkovnjv.amplifyapp.com/login

Outputs:
  FunctionUrl:
    Description: "Lambda Function URL"
    Value: !GetAtt CalibrateApiFunctionUrl.FunctionUrl
  UserPoolId:
    Description: "Cognito user pool id"
    Value: !Ref UserPool
  HostedUiDomain:
    Description: "Cognito hosted UI domain"
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  AppClientId:
    Description: "Cognito app client id"
    Value: !Ref AppClient
